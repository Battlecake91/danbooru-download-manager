services:
  danbooru-manager-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: danbooru-manager-web
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${DANBOORU_WEB_BIND:-127.0.0.1}:8765:8765"
    environment:
      DANBOORU_DATA_DIR: /data
      DANBOORU_OUTPUT_DIR: "${DANBOORU_OUTPUT_DIR:-/archive}"
      DANBOORU_DESKTOP_API_TOKEN: "${DANBOORU_DESKTOP_API_TOKEN:-}"
    volumes:
      - ./danbooru_manager_data:/data
      - "${DANBOORU_ARCHIVE_DIR:-./danbooru_saved}:/archive"

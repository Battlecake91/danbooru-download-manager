services:
  danbooru-manager-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: danbooru-manager-web
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${DANBOORU_WEB_BIND:-127.0.0.1}:8765:8765"
    environment:
      DANBOORU_DATA_DIR: /state
      DANBOORU_ARCHIVE_ROOT: /archive
      DANBOORU_CACHE_ROOT: /cache
      DANBOORU_IMPORT_ROOT: /import
      DANBOORU_DESKTOP_API_TOKEN: "${DANBOORU_DESKTOP_API_TOKEN:-}"
    volumes:
      - "${DANBOORU_STATE_DIR:?Set DANBOORU_STATE_DIR in .env}:/state"
      - "${DANBOORU_ARCHIVE_DIR:?Set DANBOORU_ARCHIVE_DIR in .env}:/archive"
      - "${DANBOORU_CACHE_DIR:?Set DANBOORU_CACHE_DIR in .env}:/cache"
      - "${DANBOORU_IMPORT_DIR:?Set DANBOORU_IMPORT_DIR in .env}:/import:ro"

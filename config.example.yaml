# Danbooru Manager - Beispielkonfiguration

base_url: "https://danbooru.donmai.us"

search_tags: "order:id_desc"

use_saved_searches: false
saved_search_labels: []
saved_search_queries: []
saved_search_extra_tags: "( rating:q or rating:e )"

limit: 100
max_posts_per_query: 200
max_total_posts: 500
request_timeout_seconds: 30
user_agent: "DanbooruManager/0.1"

work_dir: "./danbooru_manager_data"
database_file: "./danbooru_manager_data/danbooru_manager.db"
thumbnail_dir: "./danbooru_manager_data/thumbnails"
original_cache_dir: "./danbooru_manager_data/originals"

history_file: "./downloaded_ids.txt"

thumbnail_size: 256
thumbnail_format: "jpg"

gui:
  thumbnail_size: 180
  card_width_extra: 60

  status_colors:
    new: "#666666"
    potential: "#2e7d32"
    review: "#f9a825"
    auto_rejected: "#546e7a"
    rejected: "#b71c1c"
    accepted: "#1565c0"

    # Bereits geladene Posts, z. B. aus dem History-Import.
    downloaded: "#8e24aa"

    saved: "#00838f"

  status_border_width:
    default: 2
    marked: 3
    downloaded: 4

username: null
api_key: null

categories:
  - name: "_unmatched"
    folder_name: "_unmatched"
    output_path: null
    hotkey: "U"
    include: []
    exclude: []

filename:
  max_length: 180
  tags_count: 8
  excluded_tags:
    - highres
    - absurdres
    - commentary_request

llm:
  enabled: false
  backend: "none"
  tag_aliases: {}

# Danbooru Manager - Beispielkonfiguration

base_url: "https://danbooru.donmai.us"

# Direkte Suche, wenn use_saved_searches false ist.
search_tags: "order:id_desc"

# Optional: Saved Searches verwenden.
use_saved_searches: false
saved_search_labels: []
saved_search_queries: []
saved_search_extra_tags: "( rating:q or rating:e )"

# API
limit: 100
max_posts_per_query: 200
max_total_posts: 500
request_timeout_seconds: 30
user_agent: "DanbooruManager/0.1"

# Pfade
work_dir: "./danbooru_manager_data"
database_file: "./danbooru_manager_data/danbooru_manager.db"
thumbnail_dir: "./danbooru_manager_data/thumbnails"
original_cache_dir: "./danbooru_manager_data/originals"

# Alte History kann optional übernommen werden.
history_file: "./downloaded_ids.txt"

# Thumbnail
thumbnail_size: 256
thumbnail_format: "jpg"

# Auth kann aus .env kommen:
# DANBOORU_USERNAME=
# DANBOORU_API_KEY=
username: null
api_key: null

# Kategorien sind bereits vorbereitet, werden in Version 0.1 aber nur in die DB übernommen.
categories:
  - name: "_unmatched"
    folder_name: "_unmatched"
    output_path: null
    hotkey: "U"
    include: []
    exclude: []

filename:
  max_length: 180
  tags_count: 8
  excluded_tags:
    - highres
    - absurdres
    - commentary_request

llm:
  enabled: false
  backend: "none"
  tag_aliases: {}

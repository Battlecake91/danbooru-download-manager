# Danbooru Manager - Beispielkonfiguration

base_url: "https://danbooru.donmai.us"

search_tags: "order:id_desc"

use_saved_searches: false
saved_search_labels: []
saved_search_queries: []
saved_search_extra_tags: "( rating:q or rating:e )"

# Presets für den GUI-Tab "Fetch / Suche".
# Diese Werte sind Start-/Default-Basis aus YAML.
# Die eigentliche laufende Konfiguration bleibt SQLite-geführt, wo sinnvoll.
fetch_presets:
  - name: "Standard: Config Query"
    mode: "tags"
    query: "order:id_desc"
    extra_tags: "( rating:q or rating:e )"
    limit: 100
    max_posts_per_query: 500
    max_total_posts: 1000

  - name: "Saved Searches: explicit/questionable"
    mode: "saved_searches"
    saved_search_labels: []
    saved_search_queries: []
    extra_tags: "( rating:q or rating:e )"
    limit: 100
    max_posts_per_query: 500
    max_total_posts: 1000

  - name: "Manuell-Beispiel: blonde_hair"
    mode: "tags"
    query: "blonde_hair order:id_desc"
    extra_tags: "( rating:q or rating:e )"
    limit: 100
    max_posts_per_query: 300
    max_total_posts: 500

limit: 100
max_posts_per_query: 200
max_total_posts: 500
request_timeout_seconds: 30
user_agent: "DanbooruManager/0.1"

work_dir: "./danbooru_manager_data"
database_file: "./danbooru_manager_data/danbooru_manager.db"

thumbnail_dir: "./danbooru_manager_data/thumbnails/active"
active_thumbnail_dir: "./danbooru_manager_data/thumbnails/active"
saved_thumbnail_dir: "./danbooru_manager_data/thumbnails/saved"
rejected_thumbnail_dir: "./danbooru_manager_data/thumbnails/rejected"

original_cache_dir: "./danbooru_manager_data/originals/cache"
default_output_dir: "./danbooru_saved"

history_file: "./downloaded_ids.txt"

thumbnail_size: 256
thumbnail_format: "jpg"
thumbnail_download_source: "large"
thumbnail_redownload_existing: false

viewer_download_source: "file"

workflow:
  worklist_statuses:
    - new
    - potential
    - review
    - selected_save

  rejected_thumbnail_retention_days: 7

viewer:
  default_view: "worklist"
  allow_all_status_view: true
  open_original_post_in_browser: true
  fit_to_window: true
  auto_advance_after_save: true
  auto_advance_after_reject: true

gui:
  thumbnail_size: 340
  thumbnail_size_min: 120
  thumbnail_size_max: 700
  thumbnail_size_step: 20
  card_width_extra: 100

  status_colors:
    new: "#666666"
    potential: "#2e7d32"
    review: "#f9a825"
    selected_save: "#00acc1"
    auto_rejected: "#546e7a"
    rejected: "#b71c1c"
    accepted: "#1565c0"
    already_known: "#6d4c41"
    downloaded: "#8e24aa"
    saved: "#00838f"

  status_border_width:
    default: 2
    marked: 3
    downloaded: 4
    saved: 4
    rejected: 3

username: null
api_key: null

categories:
  - name: "_unmatched"
    folder_name: "_unmatched"
    output_path: null
    hotkey: "U"
    include: []
    exclude: []

filename:
  pattern: "{id}_{tags}_{hash}{ext}"
  max_length: 180
  tags_count: 8
  hash_length: 8
  excluded_tags:
    - highres
    - absurdres
    - commentary_request

llm:
  enabled: false
  backend: "none"
  tag_aliases: {}

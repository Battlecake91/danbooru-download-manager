# Danbooru Tag Sorter example configuration
#
# Copy this file to config.yaml and adjust it for your local setup.
# Do not commit config.yaml if it contains private search settings.

base_url: "https://danbooru.donmai.us"

# Credentials are intentionally not stored here.
# Put them into .env instead:
#   DANBOORU_USERNAME=your_username
#   DANBOORU_API_KEY=your_api_key

search_tags: "example_copyright_tag rating:s"

use_saved_searches: true

saved_search_labels:
  - "artists"

saved_search_queries: []

saved_search_extra_tags: "example_copyright_tag ( rating:q or rating:e )"

output_dir: "./danbooru_downloads"
history_file: "./downloaded_ids.txt"

# If enabled, every run creates a subfolder inside output_dir.
# Example:
#   ./danbooru_downloads/2026-05-19_22-43-12/
#
# The history_file stays global and is not moved into this dated folder.
use_dated_output_folder: false

# Python strftime format for the dated output folder.
# Recommended:
#   "%Y-%m-%d_%H-%M-%S"
#
# Other examples:
#   "%Y-%m-%d"
#   "%d.%m.%Y_%H-%M"
dated_output_folder_format: "%Y-%m-%d_%H-%M-%S"

limit: 100
delay_seconds: 1.0

max_posts_per_query: 100
max_total_posts: 0

multi_match_mode: "first"
unmatched_folder: "_unsorted"

download_only_matching_categories: true
delete_staging_file_after_sort: true

filename_tags_count: 10
filename_max_length: 180

filename_excluded_tags:
  - "1girl"
  - "1boy"
  - "solo"
  - "looking_at_viewer"

categories:
  feet_only:
    include:
      - "feet"
    include_mode: "all"
    exclude:
      - "feet_on_table"

  feet_and_viewer:
    include:
      - "feet"
      - "looking_at_viewer"
    include_mode: "all"
    exclude:
      - "feet_on_table"

  grouped_example:
    include_groups:
      - ["feet", "looking_at_viewer"]
      - ["barefoot", "smile"]
    include_groups_mode: "any"
    exclude:
      - "comic"
      - "manga"

  character_example:
    include:
      - "example_character"
    include_mode: "all"
    exclude:
      - "comic"
      - "manga"

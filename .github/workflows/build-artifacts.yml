name: Build Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, for example 1.3.195"
        required: false
        type: string
      onefile:
        description: "Build the main app as a single executable"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
        python-version:
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Test
        run: python -m pytest

      - name: Build portable artifact
        shell: bash
        run: |
          args=(--allow-dirty)
          if [ -n "${{ inputs.version }}" ]; then
            args+=(--version "${{ inputs.version }}")
          fi
          if [ "${{ inputs.onefile }}" = "true" ]; then
            args+=(--onefile)
          fi
          python scripts/make_release.py "${args[@]}"

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/*.zip
